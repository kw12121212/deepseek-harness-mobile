schema: strict-spec-driven/main-spec/v1
schema_version: 1
artifact_type: main_spec
schema_file: templates/strict-spec-driven/schemas/main-spec.yaml
spec:
  id: bridge-private-transport
  title: dshbridge 私有传输边界
requirements:
  allowlist-forwarding:
    strength: MUST
    statement: dshbridge 必须只转发显式白名单内的 RPC、流与导出；已知与未知的未认证端点一律返回空 404，绝不提供 HTML、脚本、原生管理接口或健康发现页。
    scenarios:
      unknown-endpoint-404:
        - GIVEN: 未携带设备凭据的请求到达任意入口
        - WHEN: 请求已知或未知端点
        - THEN: 收到空 404，请求不会到达上游 dsh
      allowlisted-forward:
        - GIVEN: 已配对设备携带有效设备凭据
        - WHEN: 请求白名单内的 RPC 或打开流
        - THEN: 请求以原生 dsh 协议格式转发到上游并返回响应
  pairing-lifecycle:
    strength: MUST
    statement: 配对码必须一次性且短时效，设备凭据独立于上游 dsh 凭据；撤销对新请求立即生效，已建立的空闲连接在周期检查后被关闭。
    scenarios:
      pair-once:
        - GIVEN: 生成了一个配对码
        - WHEN: 该配对码被使用一次后再次尝试使用
        - THEN: 再次使用被拒绝，必须用新生成的配对码重新配对
      revoke-immediate:
        - GIVEN: 设备已配对且连接活跃
        - WHEN: 管理员撤销该设备
        - THEN: 该设备的新请求立即被拒，既有空闲连接随后被断开
  no-plaintext-fallback:
    strength: MUST
    statement: 私有连接失败时绝不回落到原生 dsh 路由；公网监听必须经 TLS，明文公网监听被拒绝；忘记私有配置即凭据失效，需重新配对。
    scenarios:
      no-fallback:
        - GIVEN: 设备处于私有服务模式且连接失败
        - WHEN: 应用尝试重连
        - THEN: 只重试私有链路，绝不改用原生 dsh 路由或降级为明文
  upstream-version-gate:
    strength: MUST
    statement: dshbridge 启动 serve 时必须校验上游 dsh 版本与声明的兼容版本精确一致；不一致或探测不到时拒绝启动并输出包含实际与所需版本的明确原因，绝不以未校验状态对外提供配对或转发入口。
    scenarios:
      serve-refuses-incompatible-upstream:
        - GIVEN: 状态目录配置的上游 dsh 运行非兼容版本
        - WHEN: 执行 dsh-bridge serve
        - THEN: 进程拒绝启动，错误信息包含上游实际版本与所需兼容版本
      serve-refuses-unknown-upstream:
        - GIVEN: 上游版本无法探测（请求失败或落地页不含版本对象）
        - WHEN: 执行 dsh-bridge serve
        - THEN: 进程拒绝启动并说明无法确定上游版本，按不兼容处理
