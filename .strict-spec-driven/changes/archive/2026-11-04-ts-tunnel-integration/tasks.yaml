change: ts-tunnel-integration
sections:
  Implementation:
    impl-loopback-package:
      text: loopback 包：Socks5Dialer/tlsConnect/layerTls（端点识别）/Socks5TlsConnector/UpstreamConnector + LoopbackProxy（令牌前缀、在役 socket 清点、分块即发、Transfer-Encoding 响应透传），新增 Upgrade 透传分支（WebSocket 升级请求头原样转发、响应不滤头不注 close、状态行后字节泵）。
      status: complete
    impl-tunnel-package:
      text: tunnel 包：TunnelTypes（四态/SocksEndpoint/NetSnapshot/dsh- 主机名）、TunnelConfigStore（SharedPreferences，无默认地址）、GoLayer（gomobile 工厂 + NetworkInterface 快照 + 默认路由注入）、TunnelManager（@Volatile 状态 + onChange，ensureUp 幂等/connectWithKey/restart/onNetworkChanged/入网成功清 key）、TunnelIntegration（进程内装配 + TunnelRoutes 映射翻转）。
      status: complete
    impl-transport-rewrite:
      text: 传输接入单一改写点：HarnessTransport.transportRequest 入口与 Direct/Bridge 两传输的 WS URL 构造经 TunnelRoutes.rewrite；Origin/Host 头保持真实 origin；不改连接保存与凭据语义。
      status: complete
    impl-settings-and-bootstrap:
      text: MainActivity：设置 sheet 新增「隧道」段/对话框（四态显示、节点名、服务器地址保存、重输 key、重启按钮，程序化 Views 与现有体系同构）；启动 worker 对当前 serverUrl 等于隧道服务器地址时后台 ensureUp，状态变化驱动提示。
      status: complete
    impl-unit-tests:
      text: JVM 单测：LoopbackProxy 协议级（假上游连接器：GET/POST 转发与头纪律、令牌 403、chunked 透传、Upgrade 透传含 101+后续帧、stop 清 socket）；TunnelManager 状态机（假 GoNode/Proxy 工厂：首启 needs-key、up 成功 connected+清 key、幂等早退、up 失败分态、loopback 失败回滚、restart）。
      status: complete
  Testing:
    test-unit-new:
      text: 新增 JVM 单测全绿（LoopbackProxy 协议级含 Upgrade 透传；TunnelManager 状态机）。
