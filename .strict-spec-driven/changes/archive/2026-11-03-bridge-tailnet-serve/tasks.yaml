change: bridge-tailnet-serve
sections:
  Implementation:
    impl-serve-script:
      text: 新增 bridge/scripts/tailscale-serve.sh：serve/status/reset 三子命令；--state 或 DSHBRIDGE_STATE 定位 config.json 取 listen 得后端端口，DSHBRIDGE_SERVE_PORT 覆盖 serve 端口；python3 解析 tailscale serve status --json 判端口状态（free/ours/taken），拒绝 TCP 转发、明文 HTTP serve、Funnel、前台会话占用；后端存活检查接受任意 HTTP 状态码；sudo 免密自动提权、被拒给修复命令；reset 只移除确属本服务的配置。
      status: complete
    impl-script-tests:
      text: 新增 bridge/scripts/test-tailscale-serve.sh 确定性测试：复制 serve 脚本进临时目录，PATH 前放置假 tailscale/curl/sudo 命令记录调用并模拟 serve status --json 各形态（空配置、本服务反代、TCP 转发、明文 HTTP、Funnel、前台会话、其他服务占用、status 读取失败、后端不健康、写入被拒），从外部断言脚本退出码与输出，不触碰真实 tailnet 与真实文件系统之外的位置。
      status: complete
    impl-docs:
      text: bridge/README.md 新增 tailnet serve 部署段落：serve 运行形态（dsh-bridge serve --behind-tls-proxy + --public-origin https://<节点域名>:<serve端口>）、脚本用法（serve/status/reset、DSHBRIDGE_SERVE_PORT/DSHBRIDGE_STATE）、Windows host 需 Git Bash 或 WSL 的运行时依赖、禁止 serve --tcp/--tls-terminated-tcp/Funnel 的原因（不写 X-Forwarded-For）、pair 限流经 serve 收敛为全局 10 次/分钟的行为说明、tailnet ACL 决定谁能连；docs/qa/tailnet-serve/ 建验证记录。
      status: complete
  Testing:
    test-script-tests:
      text: 确定性脚本测试全绿：bash bridge/scripts/test-tailscale-serve.sh，覆盖端口状态机各分支、拒绝分支、提权与 reset 守护分支。
      status: complete
      command: bash bridge/scripts/test-tailscale-serve.sh
