sections:
  Implementation:
    impl-bridge-version-probe:
      text: bridge：internal/upstream 新增版本探测——已认证 GET 上游根路径（读上限 1 MiB），提取 __DSH_BOOT__ 对象的 release.version；声明 CompatibleDSHVersion 常量 0.2.0-rc.2；serve 启动阶段（upstream client 就绪后、监听前）校验，不等于常量或探测失败返回含实际/需要版本的明确错误拒绝启动。
      status: complete
    impl-bridge-version-tests:
      text: bridge go 单测：httptest 假上游覆盖——版本匹配放行、0.2.1-rc.2 拒绝、落地页无 __DSH_BOOT__ 拒绝、请求失败拒绝、解析器对真实 0.2.1-rc.2 落地页样本的提取。
      status: complete
    impl-app-version-contract:
      text: app：新增 DshVersionContract（Kotlin const 0.2.0-rc.2 + __DSH_BOOT__ release.version 解析器）；直连「测试并连接」在凭据交换成功后、sessions() 前探测校验，不匹配/探测失败在 errorView 显示含实际与所需版本的引导文案并恢复按钮，不保存不连接。
      status: complete
    impl-app-version-tests:
      text: app 单测：__DSH_BOOT__ 解析（正常/无对象/无版本/畸形/2MiB 大 padding）、常量金丝雀、版本门禁决策三分支（匹配放行/不匹配拒绝携带上游版本/探测不到拒绝）与未认证跳过门禁分支（裸地址首连走既有认证流程，unchanged_behavior）；连接对话框拒绝文案的双语与版本插值由模拟器真机证据覆盖（docs/qa/dsh-version-lock/）。
      status: complete
    impl-docs-version-wording:
      text: 文档同步：bridge/README.md 版本表述从「preserves dsh 0.2.0-rc.2 message formats」升级为「serve 启动强制校验上游版本=0.2.0-rc.2，不匹配拒绝启动、升级走显式变更」；连接对话框既有「适配 dsh 0.2.0-rc.2」文案保持与常量一致。
      status: complete
