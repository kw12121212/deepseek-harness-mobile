planned_change:
  id: dsh-version-lock
  milestone: tailscale-private-transport
status: planned
summary: dsh 版本锁定：声明兼容版本（0.2.0-rc.2），direct 与 bridge 两条路径连接时校验上游版本，不匹配明确拒绝或提示，配回归测试
details: 现状：App 只有提示文案（此版本需要 dsh 0.2.0-rc.2 的核心接口），bridge 对上游 dsh 版本零校验，protocolVersion 1 只是 bridge 外层协议。本变更为真锁：单一常量处声明兼容的 dsh 版本契约；bridge 在 serve/pair 握手阶段探测上游 dsh 版本（用现有白名单内的轻量 RPC 或启动探测），不兼容则拒绝启动或拒绝 pair 并给出明确原因；direct 路径在测试并连接时校验版本，不匹配给出引导文案而非静默失败。语义决策（变更设计时定）：锁精确版本还是最低兼容范围、预发布（rc）与正式版如何区分。测试：app 单测覆盖版本解析与不匹配分支，bridge go test 覆盖上游版本探测与拒绝路径；文档同步更新 README/AGENTS 的版本表述。
depends_on: []
