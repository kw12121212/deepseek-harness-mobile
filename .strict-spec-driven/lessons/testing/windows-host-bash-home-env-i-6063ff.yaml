lesson:
  id: windows-host-bash-home-env-i-6063ff
  title: Windows host 上 bash 脚本确定性测试勿覆盖 HOME 或用 env -i
category: testing
status: active
created_at: '2026-11-03T13:26:53.501Z'
updated_at: '2026-11-03T13:26:53.501Z'
context: bridge-tailnet-serve 为 tailscale-serve.sh 编写假命令（tailscale/curl/sudo）确定性测试，host 为 Windows Git Bash。
observation: 首版测试用 env -i + HOME 覆盖做隔离，本机 python3 是 $HOME 相对路径的 shim，直接退出 127；改回只前置 PATH 后通过。另发现空闲节点的 tailscale serve status --json 输出 null 而非空串，假命令若不建模 null，脚本会把正常空闲态判为解析失败。
takeaway: 在 Windows host 上只做 PATH 前置假命令、保留系统环境变量；为新 CLI 写假实现时先在本机抓真实输出（含空态）逐字段对照，别按想象建模。
applies_when: 在 Windows/Git Bash host 上为 bash 运维脚本写确定性假命令测试，或为真实 CLI（tailscale 等）编写假实现时
occurrences:
  - origin: bridge-tailnet-serve
    date: '2026-11-03'
    evidence: bridge/scripts/test-tailscale-serve.sh 头部注释（不用 env -i 的原因）与 fake tailscale 的 null 空态分支；docs/qa/tailnet-serve/validation.md 真机 JSON 形态记录
